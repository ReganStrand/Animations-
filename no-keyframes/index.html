<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No Keyframes</title>
<style>
  /* Two faces: Anton (display) and Inter (UI), Regan Strand brand. */
  @font-face { font-family: Display; src: url(fonts/display.ttf) format('truetype'); font-weight: 400; }
  @font-face { font-family: UI; src: url(fonts/ui-300.ttf) format('truetype'); font-weight: 300; }
  @font-face { font-family: UI; src: url(fonts/ui-400.ttf) format('truetype'); font-weight: 400; }
  @font-face { font-family: UI; src: url(fonts/ui-500.ttf) format('truetype'); font-weight: 500; }
  @font-face { font-family: UI; src: url(fonts/ui-600.ttf) format('truetype'); font-weight: 600; }
  html, body { margin: 0; height: 100%; background: #0c0d0e; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm": "/node_modules/opentype.js/dist/opentype.module.js"
} }
</script>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
